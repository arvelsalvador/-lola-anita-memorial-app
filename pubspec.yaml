name: nita
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  visibility_detector: ^0.4.0+2
  provider: ^6.1.5+1
  flutter_staggered_grid_view: ^0.7.0
  audioplayers: ^6.7.1
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  fvp: ^0.38.1
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # NOTE: subfolders with spaces must be listed explicitly — a bare
  # `assets/images/` parent entry silently skips spaced dirs on Windows
  # (empty folders in the bundle, zero image files). Keep every entry.
  assets:
    - assets/images/
    - assets/images/Best Pictures/
    - assets/images/Editing images/
    - assets/images/Family DP/
    - assets/images/gallery/After death/
    - assets/images/gallery/Bahay/
    - assets/images/gallery/Bday/
    - assets/images/gallery/Family picture with nanay/
    - assets/images/gallery/Final days/
    - assets/images/gallery/Hospital/
    - assets/images/gallery/Jollibee/
    - assets/images/gallery/Solo/
    - assets/Video/
    - assets/audio/

  # Two-Voice Rule (DESIGN.md): PlayfairDisplay = display/headings,
  # Lora = body. Bundled locally (no runtime font fetch); only weights
  # actually referenced in code are bundled.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/playfair_display/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Regular.ttf
        - asset: assets/fonts/lora/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/lora/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/lora/Lora-SemiBold.ttf
          weight: 600
