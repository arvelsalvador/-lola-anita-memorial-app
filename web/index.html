<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">

  <meta property="og:description" content="Beloved grandmother, keeper of stories. View her life journey, gallery, and cherished memories.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arvelsalvador.github.io/-lola-anita-memorial-app/">

  <meta name="twitter:card" content="summary_large_image">

  <!--
    Fonts are bundled with the app (Inter + Playfair Display in pubspec).
    No external Google Fonts request here: it blocked first paint on slow
    connections and was never used by the Flutter UI.

  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- First-paint loading screen: shown until Flutter inserts its view.
       Keeps a slow connection from looking like a blank/broken page. -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #2E1F17;
    }

    #app-loader,
    .app-noscript {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-sizing: border-box;
      padding: calc(24px + env(safe-area-inset-top)) 24px
               calc(24px + env(safe-area-inset-bottom));
      text-align: center;
      color: #F4E9D7;
      background: radial-gradient(
        circle at 50% 40%,
        #4A3528 0%,
        #2E1F17 55%,
        #1F1510 100%
      );
    }

    #app-loader {
      display: none;
      transition: opacity 400ms ease;
    }

    #app-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .app-loader-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(198, 161, 91, 0.22);
      border-top-color: #C6A15B;
      animation: app-loader-spin 1s linear infinite;
    }

    .app-loader-title {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 23px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .app-loader-sub {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   Arial, sans-serif;
      font-size: 14px;
      color: #D9C6AD;
    }

    .app-loader-hint {
      max-width: 320px;
      margin: 4px 0 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   Arial, sans-serif;
      font-size: 12px;
      line-height: 1.55;
      color: #A9927A;
    }

    .app-noscript {
      gap: 10px;
    }

    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loader-ring { animation: none; }
      #app-loader { transition: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <div id="app-loader" role="status" aria-live="polite">
    <div class="app-loader-ring" aria-hidden="true"></div>
    <p class="app-loader-title">In Loving Memory</p>
    <p class="app-loader-sub">Loading the memorial…</p>
    <p class="app-loader-hint" id="app-loader-hint">
      This can take a little longer on a slow connection.
    </p>
  </div>

  <noscript>
    <div class="app-noscript">
      <p class="app-loader-title">In Loving Memory</p>
      <p class="app-loader-sub">
        Please enable JavaScript to view this memorial.
      </p>
      <p class="app-loader-sub">
        Paki-enable ang JavaScript para makita ang memorial.
      </p>
    </div>
  </noscript>

  <script>
    (function () {
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      // Only show the spinner when JavaScript is running; the <noscript>
      // message above covers the opposite case.
      loader.style.display = 'flex';

      var hint = document.getElementById('app-loader-hint');
      var hidden = false;

      function hideLoader() {
        if (hidden) return;
        hidden = true;
        // Let the engine paint its first frame behind the overlay, so the
        // dark splash fades in without a flash of empty page.
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            loader.classList.add('is-hidden');
            window.setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 500);
          });
        });
      }

      // Wait for Flutter to actually render its first frame (not just insert
      // an empty <flutter-view> container before Dart main() finishes).
      window.addEventListener('flutter-first-frame', hideLoader, { once: true });

      // If the app never appears, explain and offer a clean cache reset.
      window.setTimeout(function () {
        if (!hidden && hint) {
          hint.textContent =
            'Still loading. A slow connection can take up to a minute. ' +
            'Tap here to refresh if this takes too long.';
          hint.style.cursor = 'pointer';
          hint.style.textDecoration = 'underline';
          hint.onclick = function () {
            if (window.__hardReloadMemorial) {
              window.__hardReloadMemorial();
            } else {
              window.location.reload();
            }
          };
        }
      }, 10000);
    })();
  </script>

  <script>
    (function () {
      window.__hardReloadMemorial = function () {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                })
              );
            }).catch(function () {})
          );
        }
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                })
              );
            }).catch(function () {})
          );
        }
        Promise.all(tasks).finally(function () {
          window.location.reload();
        });
      };

      function bootFlutter() {
        if (window.__flutterBooted) return;
        window.__flutterBooted = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      var cleanup = [];
      if ('serviceWorker' in navigator) {
        cleanup.push(
          navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              return Promise.all(
                registrations.map(function (r) {
                  return r.unregister();
                })
              );
            })
            .catch(function () {})
        );
        // Prevent flutter_bootstrap.js from seeing an existing registration and
        // attempting to re-register/wait for flutter_service_worker.js on
        // repeat visits in the same browser profile.
        try {
          navigator.serviceWorker.getRegistration = function () {
            return Promise.resolve(undefined);
          };
        } catch (_) {}
      }

      if ('caches' in window) {
        cleanup.push(
          caches
            .keys()
            .then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                })
              );
            })
            .catch(function () {})
        );
      }

      if (cleanup.length === 0) {
        bootFlutter();
      } else {
        var fallback = window.setTimeout(bootFlutter, 600);
        Promise.all(cleanup).finally(function () {
          window.clearTimeout(fallback);
          bootFlutter();
        });
      }
    })();
  </script>
</body>
</html>
