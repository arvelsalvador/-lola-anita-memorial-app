# Name shown in the "Actions" tab on GitHub
name: Deploy Flutter Web to GitHub Pages

# WHEN does this run?
on:
  push:
    branches: [main]      # every time you push to main
  workflow_dispatch:      # also lets you run it manually with a button

# Permissions GitHub needs to publish your site
permissions:
  contents: read
  pages: write
  id-token: write

# Wait for in-flight migrations/deploys rather than cancelling a migration mid-run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # JOB 1: apply any pending database migrations before building the app
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check SUPABASE_DB_URL secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is empty or was not found. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *$'\n'*)
              echo "::error::SUPABASE_DB_URL contains a newline — paste only the single-line postgresql:// URI."
              exit 1
              ;;
            *YOUR-PASSWORD*|*\[YOUR-PASSWORD\]*)
              echo "::error::SUPABASE_DB_URL still contains the YOUR-PASSWORD placeholder."
              exit 1
              ;;
          esac
          echo "SUPABASE_DB_URL is present (length=${#SUPABASE_DB_URL}, value hidden)."

      - name: Push pending database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL"

  # JOB 2: build the Flutter web app (only runs if database migrations succeeded)
  build:
    needs: database
    runs-on: ubuntu-latest   # a free temporary Linux computer from GitHub
    steps:
      # Download your code onto that computer
      - uses: actions/checkout@v4

      # Install Flutter (stable channel) on that computer
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true        # remembers Flutter so the next build is faster

      # Download your packages (same as running it on your PC)
      - run: flutter pub get

      # Fail loudly when the Supabase secrets are missing. Without this the
      # build silently falls back to local-only mode and the published site
      # looks "not connected" even though Supabase itself is healthy.
      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is empty or was not found."
            missing=1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY is empty or was not found."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add them in Settings > Secrets and variables > Actions (repository secrets), then re-run this workflow."
            exit 1
          fi
          echo "Both Supabase secrets are present (values hidden)."

      # Build the web version.
      # --base-href must match your repo name, so GitHub finds your files.
      # The repo name is filled in automatically below.
      # The Supabase values are baked in at build time (String.fromEnvironment
      # in lib/core/constants/supabase_config.dart), so they must be passed here.
      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Lengths only — never print secret values.
          echo "SUPABASE_URL length=${#SUPABASE_URL}"
          echo "SUPABASE_PUBLISHABLE_KEY length=${#SUPABASE_PUBLISHABLE_KEY}"
          case "$SUPABASE_URL" in
            *$'\n'*) echo "::error::SUPABASE_URL contains a newline — the secret value has more than just the URL." ;;
          esac
          case "$SUPABASE_PUBLISHABLE_KEY" in
            *$'\n'*) echo "::error::SUPABASE_PUBLISHABLE_KEY contains a newline." ;;
          esac
          flutter --version
          set +e
          flutter build web --release \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the real error as a public annotation (the step log
            # itself needs a GitHub login to read).
            tail -n 25 "$RUNNER_TEMP/build.log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::build: $line"
            done
            exit "$status"
          fi

      # Package the build/web folder so it can be published
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # JOB 3: publish the packaged files
  deploy:
    needs: build             # only runs if the build succeeded
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   # your live link appears here
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Post-deploy health check: confirms the public forum can still be read
      # and that the reply_to_name column exists on pakikiramay_replies.
      - name: Post-deploy database health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          base="${SUPABASE_URL%/}/rest/v1"

          echo "Checking forum read access (pakikiramay_messages)..."
          messages_resp=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${base}/pakikiramay_messages?select=id,name,message,approved,created_at&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept-Profile: public")

          case "$messages_resp" in
            \[*\]) echo "pakikiramay_messages is readable." ;;
            *)
              echo "::error::Health check failed: pakikiramay_messages returned unexpected response: ${messages_resp}"
              exit 1
              ;;
          esac

          echo "Checking pakikiramay_replies.reply_to_name column..."
          replies_resp=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${base}/pakikiramay_replies?select=id,post_id,author_name,message,reply_to_name,created_at&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept-Profile: public")

          case "$replies_resp" in
            \[*\]) echo "pakikiramay_replies.reply_to_name exists and is readable." ;;
            *)
              echo "::error::Health check failed: pakikiramay_replies.reply_to_name check returned: ${replies_resp}"
              exit 1
              ;;
          esac

          echo "Post-deploy health check passed."


      # Post-deploy health check: confirms the public forum can still be read
      # and that the reply_to_name column exists on pakikiramay_replies.
      - name: Post-deploy database health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          base="${SUPABASE_URL%/}/rest/v1"

          echo "Checking forum read access (pakikiramay_messages)..."
          messages_resp=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${base}/pakikiramay_messages?select=id,name,message,approved,created_at&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept-Profile: public")

          case "$messages_resp" in
            \[*\]) echo "pakikiramay_messages is readable." ;;
            *)
              echo "::error::Health check failed: pakikiramay_messages returned unexpected response: ${messages_resp}"
              exit 1
              ;;
          esac

          echo "Checking pakikiramay_replies.reply_to_name column..."
          replies_resp=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${base}/pakikiramay_replies?select=id,post_id,author_name,message,reply_to_name,created_at&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept-Profile: public")

          case "$replies_resp" in
            \[*\]) echo "pakikiramay_replies.reply_to_name exists and is readable." ;;
            *)
              echo "::error::Health check failed: pakikiramay_replies.reply_to_name check returned: ${replies_resp}"
              exit 1
              ;;
          esac

          echo "Post-deploy health check passed."